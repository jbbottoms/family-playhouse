<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Three Saturn clocks compared to the interior day">
  <rect width="920" height="420" fill="#07080c"/>
  <text x="36" y="42" fill="#e8e0d4" font-family="Georgia, serif" font-size="26">three clocks, one planet</text>
  <text x="36" y="68" fill="#8a8074" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">how much longer than Helled 2015 interior (10h 32m 45s)</text>
  <text x="36" y="110" fill="#6a6258" font-family="ui-sans-serif, system-ui" font-size="11">0%</text>
  <text x="430" y="110" fill="#6a6258" font-family="ui-sans-serif, system-ui" font-size="11">1.2%</text>
  <text x="824" y="110" fill="#6a6258" font-family="ui-sans-serif, system-ui" font-size="11">2.4%</text>
  <line x1="36" y1="118" x2="860" y2="118" stroke="#2a241c"/>
  <text x="36" y="158" fill="#8ec8c8" font-family="Georgia, serif" font-size="16">interior</text>
  <text x="200" y="158" fill="#8a8074" font-family="ui-sans-serif, system-ui" font-size="13">10h 32m 45s - gravity - the floor</text>
  <rect x="36" y="168" width="4" height="18" fill="#8ec8c8"/>
  <text x="36" y="228" fill="#5ad2dc" font-family="Georgia, serif" font-size="16">hexagon jet</text>
  <text x="200" y="228" fill="#8a8074" font-family="ui-sans-serif, system-ui" font-size="13">10h 39m 23s - +6m 38s - 1.05% slower - locked 1980-2014</text>
  <rect x="36" y="238" width="360" height="18" fill="#5ad2dc"/>
  <text x="36" y="368" fill="#e6c36a" font-family="Georgia, serif" font-size="16">radio north</text>
  <text x="200" y="368" fill="#8a8074" font-family="ui-sans-serif, system-ui" font-size="13">10.79 h - +14m 39s - 2.32% slower - Cassini end - then phase lost</text>
  <rect x="36" y="378" width="796" height="18" fill="#e6c36a"/>
</svg>
