  <title>Lookalikes — Herschel is not Odysseus</title>

<body>
  <header>
    <h1>lookalikes</h1>
    <p class="lede warn">Dad said captions help him learn. Two craters wear the same costume. One moon wears two faces. Photojournal under every still.</p>
    <p class="lede">I almost called Tethys “Mimas” last room. They are not the same punch. Next room is the can that may have painted Iapetus. <a href="phoebe.html">paint can</a> · <a href="house.html">the house</a> · <a href="../SATURN.md">map</a> · <a href="../index.html">home</a></p>
  </header>
  <div class="compare">
    <svg viewBox="0 0 960 250" role="img" aria-label="Three moons scaled, with their giant craters marked">
      <rect width="960" height="250" fill="#07080c" />
      <text x="20" y="26" fill="#6f6860" font-size="12" font-family="ui-sans-serif, system-ui">moons to scale · crater width as a slice of the ball</text>
      <g transform="translate(150,145)">
        <circle r="38" fill="#1b1e28" stroke="#8ec8c8" stroke-width="2" />
        <circle cx="10" cy="-4" r="12.5" fill="none" stroke="#e6c36a" stroke-width="2" />
        <text x="-48" y="68" fill="#b9b0a4" font-size="13" font-family="Georgia, serif">Mimas 396 km</text>
        <text x="-48" y="86" fill="#e6c36a" font-size="12" font-family="Georgia, serif">Herschel 130 km · 33%</text>
      </g>
      <g transform="translate(430,145)">
        <circle r="101" fill="#1b1e28" stroke="#c99b46" stroke-width="2" />
        <circle cx="28" cy="8" r="43" fill="none" stroke="#e6c36a" stroke-width="2" />
        <text x="-70" y="124" fill="#b9b0a4" font-size="13" font-family="Georgia, serif">Tethys 1,062 km</text>
        <text x="-70" y="142" fill="#e6c36a" font-size="12" font-family="Georgia, serif">Odysseus 450 km · 42%</text>
      </g>
      <g transform="translate(760,145)">
        <circle r="140" fill="#1b1e28" stroke="#e07a5f" stroke-width="2" />
        <circle cx="-30" cy="-10" r="55" fill="none" stroke="#e6c36a" stroke-width="2" />
        <text x="-80" y="124" fill="#b9b0a4" font-size="13" font-family="Georgia, serif">Iapetus 1,471 km</text>
        <text x="-80" y="142" fill="#e6c36a" font-size="12" font-family="Georgia, serif">Turgis 580 km · 39%</text>
      </g>
    </svg>
  </div>
  <div class="wall">
    <figure>
      <img src="https://images-assets.nasa.gov/image/PIA12568/PIA12568~orig.jpg" alt="Cassini mosaic looking into Mimas Herschel Crater" />
      <figcaption>
        <span class="id">PIA12568 · Examining Herschel Crater · 13 Feb 2010</span>
        <strong>This is the Death Star one. Mimas.</strong>
        Herschel is 130 km wide on a moon only 396 km across — 33% of the ball. Cassini came within 9,500 km. Walls about 20% brighter than the floors. Scientists read the dark streaks as impurities sliding down while ice evaporates. Melt from the impact puddled around the central peak. 180 m per pixel.
      </figcaption>
    </figure>
    <figure>
      <img src="https://images-assets.nasa.gov/image/PIA18317/PIA18317~orig.jpg" alt="Tethys with the giant crater Odysseus" />
      <figcaption>
        <span class="id">PIA18317 · Tethys the Target · 11 Apr 2015</span>
        <strong>This is the bigger punch. Tethys.</strong>
        Odysseus is 450 km wide on a 1,062 km moon — 42% of the ball, about 4.5% of the surface. NASA: a crater that size on Earth would be as large as Russia. Odysseus is 3.5× wider than Herschel in kilometers. Tethys itself is 2.7× wider than Mimas. Same costume. Different house.
      </figcaption>
    </figure>
    <figure class="wide">
      <img src="https://images-assets.nasa.gov/image/PIA11690/PIA11690~orig.jpg" alt="Iapetus leading dark hemisphere next to bright trailing hemisphere" />
      <figcaption>
        <span class="id">PIA11690 · Global View of Iapetus’ Dichotomy</span>
        <strong>One moon, two albedos.</strong>
        Left: leading side, almost as dark as charcoal, about 40% of the surface (Cassini Regio). Right: trailing side, almost as bright as snow (Roncevaux Terra north, Saragossa Terra south). Dark reflectivity about 4%. Bright ice over 60%. That is 15× more light coming back. Turgis, the big basin on the dark edge, is 580 km — 39% as wide as Iapetus. Slow day: 1,904 hours.
      </figcaption>
    </figure>
    <figure class="wide">
      <img src="https://images-assets.nasa.gov/image/PIA06166/PIA06166~orig.jpg" alt="Cassini New Year Eve 2004 global view of dark Iapetus" />
      <figcaption>
        <span class="id">PIA06166 · Encountering Iapetus · 31 Dec 2004</span>
        <strong>The equator grew a mountain belt no one has explained.</strong>
        New Year’s Eve flyby. Dark deposits near 4% reflectivity coat the leading face. Past about 40° latitude the ice jumps over 60%. A 20 km-wide ridge runs almost exactly on the equator for 1,300 km in this frame; on the left limb it stands at least 13 km high. Folded mountains, or a crack that erupted? NASA said not yet clear. The dark stuff: erupted from inside, or painted by dust from outer moons? This mosaic does not pick a winner.
      </figcaption>
    </figure>
  </div>
